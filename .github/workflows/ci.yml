name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt flake8 pylint black
      - name: Set up config
        # main.py does `import config` at module level, so pylint
        # needs a config.py present to resolve it. config.py itself
        # is gitignored (may hold real credentials locally), so CI
        # builds one from the safe, committed example.
        run: cp config.example.py config.py
      - name: Black (check)
        run: python -m black --check .
      - name: Flake8
        run: python -m flake8 .
      - name: Pylint
        run: python -m pylint main.py core/*.py
